# Render Blueprint for the Moka backend (FastAPI + SQLite).
# Frontend stays on Vercel (Root Directory: frontend). Point the Vercel env var
# VITE_BACKEND_URL to this service's URL, e.g. https://moka-backend.onrender.com
services:
  - type: web
    name: moka-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Secrets & config — set these in the Render dashboard (sync:false = not stored in git).
      - key: APP_URL            # public backend URL, used for email links + OAuth redirect base
        sync: false
      - key: STRIPE_API_KEY     # sk_test_emergent (Emergent test proxy) or your live Stripe key
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMERGENT_LLM_KEY   # optional (AI match analysis)
        sync: false
      - key: RESEND_API_KEY     # optional (trial lifecycle emails)
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: ODDS_API_KEY       # enables real odds data (empty = mock)
        sync: false
      - key: API_FOOTBALL_KEY   # enables real football stats (empty = mock/sample)
        sync: false
      - key: SPORTMONKS_API_KEY # live stats for Denmark Superliga + Scotland Premiership (free plan)
        sync: false
      - key: FOOTBALL_DATA_KEY
        sync: false
      # --- Persistence (IMPORTANT) --------------------------------------------
      # RECOMMENDED: set DATABASE_URL to your Supabase/Postgres connection string
      # (Supabase -> Connect -> Session pooler URI). When present, the app stores
      # ALL users/subscriptions/trials in Postgres, so data SURVIVES redeploys.
      # Format: postgresql://postgres.<ref>:<PASSWORD>@aws-0-<region>.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
      # If DATABASE_URL is empty the app falls back to SQLite. On the free plan the
      # filesystem is EPHEMERAL, so the SQLite DB RESETS on every redeploy. For SQLite
      # persistence instead, upgrade the plan and uncomment DB_PATH + disk below.
      # - key: DB_PATH
      #   value: /var/data/moka.db
    # disk:
    #   name: moka-data
    #   mountPath: /var/data
    #   sizeGB: 1
